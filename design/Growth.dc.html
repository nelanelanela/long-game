<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Growth and forecast</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#16244A}a:hover{color:#000000}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 16px 24px 28px; background: #FAF8F4; color: #16244A; font-family: Inter, -apple-system, system-ui, sans-serif; display: flex; flex-direction: column; gap: 14px">
<div style="display: flex; align-items: center; height: 44px">
<a href="Home.dc.html" aria-label="Back" style="width: 44px; height: 44px; margin-left: -10px; display: flex; align-items: center; justify-content: center; color: #16244A"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"></path></svg></a>
</div>
<h1 style="margin: -6px 0 0; font-size: 32px; font-weight: 700; letter-spacing: -0.02em">History</h1>
<div role="tablist" aria-label="History view" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); padding: 3px; background: #EFEBE4; border-radius: 12px">
<a href="Calendar.dc.html" role="tab" aria-selected="false" style="height: 36px; border-radius: 10px; color: #16244A; font-size: 14px; font-weight: 500; text-decoration: none; display: flex; align-items: center; justify-content: center">Calendar</a>
<button type="button" role="tab" aria-selected="true" style="height: 36px; border: 0; border-radius: 10px; background: #FFFFFF; color: #16244A; font: inherit; font-size: 14px; font-weight: 600; box-shadow: 0 1px 3px rgba(22,36,74,.1)">Growth</button>
</div>

<div style="display: flex; flex-direction: column; gap: 10px; padding: 16px 14px 12px; background: #FFFFFF; border-radius: 20px; box-shadow: 0 1px 2px rgba(22,36,74,.04), 0 6px 20px rgba(22,36,74,.05)">
<div style="display: flex; flex-direction: column; gap: 2px; padding: 0 4px">
<span style="font-size: 13px; color: #5E6782">Mastery forecast</span>
<span style="font-size: 24px; font-weight: 700; letter-spacing: -0.02em">{{midDate}}</span>
<span style="font-size: 13px; color: #5E6782">Likely between {{highDate}} and {{lowDate}}</span>
</div>
<svg role="img" aria-label="{{chartLabel}}" width="320" height="210" viewBox="0 0 320 210" style="display: block; width: 100%; height: auto">
<path d="M34 188H312M34 103.2H312" stroke="#F0ECE5" stroke-width="1"></path>
<path d="M34 18.5H312" stroke="#16244A" stroke-opacity=".35" stroke-width="1" stroke-dasharray="3 4"></path>
<text x="312" y="12" text-anchor="end" font-size="10" fill="#5E6782">Mastery · 10,000 h</text>
<text x="28" y="191" text-anchor="end" font-size="10" fill="#5E6782">0</text>
<text x="28" y="106" text-anchor="end" font-size="10" fill="#5E6782">5k</text>
<text x="28" y="22" text-anchor="end" font-size="10" fill="#5E6782">10k</text>
<path d="{{bandPath}}" fill="#FF9A3C" fill-opacity=".16"></path>
<path d="{{pastArea}}" fill="#16244A" fill-opacity=".07"></path>
<path d="{{pastPath}}" fill="none" stroke="#16244A" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"></path>
<path d="{{midPath}}" fill="none" stroke="#EE6420" stroke-width="2.5" stroke-dasharray="6 5" stroke-linecap="round"></path>
<circle cx="132.8" cy="{{todayY}}" r="5" fill="#FFFFFF" stroke="#16244A" stroke-width="2.5"></circle>
<text x="132.8" y="203" text-anchor="middle" font-size="10" font-weight="600" fill="#16244A">Today</text>
<g transform="translate({{midX}} 18.5)"><path d="M0 -13V-10M0 10V13M-13 0H-10M10 0H13M-9.2 -9.2L-7 -7M7 7L9.2 9.2M-9.2 9.2L-7 7M7 -7L9.2 -9.2" stroke="#FFB627" stroke-width="2.2" stroke-linecap="round"></path><circle r="6.5" fill="#FFC93C"></circle></g>
<text x="46.6" y="203" text-anchor="middle" font-size="10" fill="#5E6782">2020</text>
<text x="173" y="203" text-anchor="middle" font-size="10" fill="#5E6782">2030</text>
<text x="236.2" y="203" text-anchor="middle" font-size="10" fill="#5E6782">2035</text>
<text x="299.4" y="203" text-anchor="middle" font-size="10" fill="#5E6782">2040</text>
</svg>
<div style="display: flex; flex-wrap: wrap; gap: 14px; padding: 0 4px; font-size: 12px; color: #5E6782">
<span style="display: flex; align-items: center; gap: 6px"><span aria-hidden="true" style="width: 14px; height: 3px; border-radius: 2px; background: #16244A"></span>Your hours</span>
<span style="display: flex; align-items: center; gap: 6px"><span aria-hidden="true" style="width: 14px; height: 0; border-top: 3px dashed #EE6420"></span>Forecast</span>
<span style="display: flex; align-items: center; gap: 6px"><span aria-hidden="true" style="width: 12px; height: 10px; border-radius: 3px; background: rgba(255,154,60,.3)"></span>Likely range</span>
</div>
</div>

<div style="display: flex; flex-direction: column; gap: 10px; padding: 14px 18px; background: #FFFFFF; border-radius: 20px; box-shadow: 0 1px 2px rgba(22,36,74,.04), 0 6px 20px rgba(22,36,74,.05)">
<div style="display: flex; align-items: baseline; justify-content: space-between">
<span style="font-size: 15px; font-weight: 600">Weekly rate by year</span>
<span style="font-size: 13px; color: #5E6782">+{{trend}} h/wk a year</span>
</div>
<div role="img" aria-label="Average hours per week: 3 in 2019 rising to 12 in 2026" style="display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 8px; align-items: end; height: 64px">
<sc-for list="{{bars}}" as="b" hint-placeholder-count="8">
<div style="display: flex; flex-direction: column; align-items: center; gap: 4px">
<div aria-hidden="true" style="width: 100%; height: {{b.h}}px; border-radius: 5px; background: {{b.fill}}"></div>
<span aria-hidden="true" style="font-size: 10px; color: #5E6782">{{b.label}}</span>
</div>
</sc-for>
</div>
</div>

<div style="display: flex; flex-direction: column; gap: 8px; padding: 14px 18px; background: #FFFFFF; border-radius: 20px; box-shadow: 0 1px 2px rgba(22,36,74,.04), 0 6px 20px rgba(22,36,74,.05)">
<div style="display: flex; align-items: baseline; justify-content: space-between">
<label for="extra" style="font-size: 15px; font-weight: 600">What if I practise more?</label>
<span style="font-size: 15px; font-weight: 600">+{{extra}} h/wk</span>
</div>
<input id="extra" type="range" min="0" max="10" step="1" value="{{extra}}" onChange="{{onExtra}}" style="width: 100%; margin: 0; accent-color: #16244A">
<span style="font-size: 13px; line-height: 1.4; color: #5E6782">{{whatIf}}</span>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const extra = (this.state && this.state.extra) || 0;
const X0 = 2019, X1 = 2041, L = 34, R = 8, T = 10, B = 22, W = 320, H = 210;
const x = (t) => (L + (t - X0) / (X1 - X0) * (W - L - R)).toFixed(1);
const y = (v) => (T + (1 - Math.min(v, 10500) / 10500) * (H - T - B)).toFixed(1);
const now = 2026.82, total = 3294;
const weekly = [3, 5, 6, 8, 10, 8, 12, 12];
const past = [[2019, 0]];
let c = 0;
weekly.forEach((w, i) => {
const end = i === 7 ? now : 2020 + i;
c += w * 52 * (end - (2019 + i));
past.push([end, i === 7 ? total : c]);
});
const pastPath = 'M' + past.map(([t, v]) => x(t) + ',' + y(v)).join(' L');
const pastArea = pastPath + ' L' + x(now) + ',' + y(0) + ' L' + x(X0) + ',' + y(0) + ' Z';
const sim = (rate0, slope, cap) => {
let t = now, v = total, end = null;
const pts = [[t, v]];
while (t < X1) {
const r = Math.min(cap, rate0 + slope * (t - now));
v += r * 52 / 12; t += 1 / 12;
if (v >= 10000) { const over = (v - 10000) / (r * 52); t -= over; v = 10000; pts.push([t, v]); end = t; break; }
pts.push([t, v]);
}
return { pts, end };
};
const low = sim(9 + extra, 0, 30);
const mid = sim(12 + extra, 0.5, 22);
const high = sim(12 + extra, 1.2, 26);
const toPath = (pts) => 'M' + pts.map(([t, v]) => x(t) + ',' + y(v)).join(' L');
const bandPath = toPath(high.pts) + ' L' + low.pts.slice().reverse().map(([t, v]) => x(t) + ',' + y(v)).join(' L') + ' Z';
const months = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
const fmt = (t) => t ? months[Math.min(11, Math.floor((t % 1) * 12))] + ' ' + Math.floor(t) : 'after 2041';
const fmtShort = (t) => t ? String(Math.floor(t)) : 'later';
const base = sim(12, 0.5, 22).end;
const gain = base && mid.end ? Math.round((base - mid.end) * 12) : 0;
const whatIf = extra === 0
? 'Based on your recent pace and how it has been growing.'
: 'About ' + (gain >= 12 ? (Math.round(gain / 12 * 10) / 10) + ' years' : gain + ' months') + ' sooner, around ' + fmt(mid.end) + '.';
const maxW = 14;
const bars = weekly.map((w, i) => ({ h: Math.round(w / maxW * 46) + 4, label: "'" + String(19 + i), fill: i === 7 ? '#FFB347' : '#E4DFD6' }));
const trend = (Math.round((weekly[7] - weekly[0]) / 7 * 10) / 10).toFixed(1);
return {
extra,
onExtra: (e) => this.setState({ extra: Number(e.target.value) }),
pastPath, pastArea, bandPath, midPath: toPath(mid.pts),
todayY: y(total), midX: mid.end ? x(mid.end) : x(X1),
midDate: fmt(mid.end), highDate: fmtShort(high.end), lowDate: fmtShort(low.end),
chartLabel: 'Cumulative hours: 3,294 today. Forecast reaches 10,000 hours around ' + fmt(mid.end) + ', likely between ' + fmtShort(high.end) + ' and ' + fmtShort(low.end) + '.',
bars, trend, whatIf
};
}
}
</script>
</body>
</html>
