<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Hours per year</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#16244A}a:hover{color:#000000}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 16px 24px 40px; background: #FAF8F4; color: #16244A; font-family: Inter, -apple-system, system-ui, sans-serif; display: flex; flex-direction: column; gap: 20px">
<div style="display: flex; align-items: center; justify-content: space-between; height: 44px">
<a href="StartYear.dc.html" aria-label="Back" style="width: 44px; height: 44px; margin-left: -10px; display: flex; align-items: center; justify-content: center; color: #16244A"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"></path></svg></a>
<div aria-label="Step 3 of 3" role="img" style="display: flex; gap: 6px">
<div style="width: 24px; height: 4px; border-radius: 2px; background: #16244A"></div>
<div style="width: 24px; height: 4px; border-radius: 2px; background: #16244A"></div>
<div style="width: 24px; height: 4px; border-radius: 2px; background: #16244A"></div>
</div>
<div style="width: 34px"></div>
</div>
<div style="display: flex; flex-direction: column; gap: 8px">
<h1 style="margin: 0; font-size: 32px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.1">Hours per week, each year</h1>
<p style="margin: 0; font-size: 16px; line-height: 1.45; color: #5E6782">More or less. Only focused practice.</p>
</div>
<div style="flex-grow: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; padding: 4px 18px; background: #FFFFFF; border-radius: 20px; box-shadow: 0 1px 2px rgba(22,36,74,.04), 0 6px 20px rgba(22,36,74,.05)">
<sc-for list="{{years}}" as="y" hint-placeholder-count="8">
<div style="display: grid; grid-template-columns: 44px minmax(0, 1fr) 48px; align-items: center; gap: 12px; height: 52px; border-bottom: 1px solid #F0ECE5">
<label for="{{y.id}}" style="font-size: 15px; font-weight: 600">{{y.year}}</label>
<input id="{{y.id}}" type="range" min="0" max="30" step="1" value="{{y.hours}}" style="width: 100%; margin: 0; accent-color: #16244A">
<span style="font-size: 15px; text-align: right; color: #5E6782; font-variant-numeric: tabular-nums">{{y.hours}} h</span>
</div>
</sc-for>
</div>
<div style="display: flex; align-items: baseline; justify-content: space-between">
<span style="font-size: 15px; color: #5E6782">Estimated so far</span>
<span style="font-size: 26px; font-weight: 700; letter-spacing: -0.02em">3,208 h</span>
</div>
<a href="Home.dc.html" style="height: 56px; flex-shrink: 0; border-radius: 16px; background: #16244A; color: #FFFFFF; font-size: 16px; font-weight: 600; text-decoration: none; display: flex; align-items: center; justify-content: center">Start tracking</a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const data = [[2019, 3], [2020, 5], [2021, 6], [2022, 8], [2023, 10], [2024, 8], [2025, 12], [2026, 12]];
return { years: data.map(([year, hours]) => ({ id: 'y' + year, year, hours })) };
}
}
</script>
</body>
</html>
