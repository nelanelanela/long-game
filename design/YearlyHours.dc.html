@keyframes hmPeekShow{0%,88%,100%{opacity:0}90%,95%{opacity:1}}
@keyframes hmPeekHide{0%,88%,100%{opacity:1}90%,95%{opacity:0}}

@keyframes hmWaveL{from{transform:translateX(0)}to{transform:translateX(-20px)}}

.hm-peek-show{opacity:0;animation:hmPeekShow 7s ease-in-out infinite}
.hm-peek-hide{animation:hmPeekHide 7s ease-in-out infinite}
.hm-wave-r{animation:hmWaveR 3.2s linear infinite}
.hm-wave-l{animation:hmWaveL 5s linear infinite}
.hm-glint{transform-box:fill-box;transform-origin:center;animation:hmGlint 2.6s ease-in-out infinite}
.hm-glow{animation:hmGlow 4s ease-in-out infinite}
@media (prefers-reduced-motion: reduce){.hm-breathe,.hm-turn,.hm-peek-show,.hm-peek-hide,.hm-wave-r,.hm-wave-l,.hm-glint,.hm-glow{animation:none}.hm-glint{opacity:.8}}
