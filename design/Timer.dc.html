<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Track a session</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&amp;display=swap">
<style>
body{margin:0}
a{color:#FFFFFF}a:hover{color:#FFE08A}
@keyframes lgSky{0%,100%{background-position:50% 0%}50%{background-position:50% 100%}}
@keyframes lgBreathe{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-4px) scale(1.045)}}
@keyframes lgRays{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
@keyframes lgRayPop{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes lgWink{0%,92%,100%{opacity:0}94%,98%{opacity:1}}
@keyframes lgWinkHide{0%,92%,100%{opacity:1}94%,98%{opacity:0}}
@keyframes lgMote{0%{transform:translateY(0) scale(.6);opacity:0}15%{opacity:.9}100%{transform:translateY(-150px) scale(1.1);opacity:0}}
@keyframes lgHalo{0%,100%{opacity:.55;transform:scale(1)}50%{opacity:.85;transform:scale(1.08)}}
.lg-sky{background:linear-gradient(180deg,#16244A 0%,#1F2A5A 40%,#3A2F6B 70%,#6E3D74 100%);background-size:100% 220%;animation:lgSky 24s ease-in-out infinite}
.lg-breathe{transform-origin:100px 100px;transform-box:view-box;animation:lgBreathe 4s ease-in-out infinite}
.lg-rays{transform-origin:100px 100px;transform-box:view-box;animation:lgRays 120s linear infinite}
.lg-next{animation:lgRayPop 1.6s ease-in-out infinite}
.lg-wink{animation:lgWink 9s ease-in-out infinite}
.lg-winkhide{animation:lgWinkHide 9s ease-in-out infinite}
.lg-halo{animation:lgHalo 4s ease-in-out infinite}
.lg-mote{position:absolute;width:6px;height:6px;border-radius:3px;background:#FFE08A;box-shadow:0 0 8px 2px rgba(255,224,138,.6);animation:lgMote 5s ease-out infinite}
@media (prefers-reduced-motion: reduce){.lg-sky,.lg-breathe,.lg-rays,.lg-next,.lg-wink,.lg-winkhide,.lg-halo,.lg-mote{animation:none}}
</style>
</helmet>
<div class="lg-sky" style="width: 390px; height: 844px; position: relative; overflow: hidden; color: #FFFFFF; font-family: Inter, -apple-system, system-ui, sans-serif">
<div aria-hidden="true" class="lg-halo" style="position: absolute; left: 50%; top: 120px; width: 300px; height: 300px; margin-left: -150px; border-radius: 150px; background: radial-gradient(circle, rgba(255,201,60,.32) 0%, rgba(255,201,60,0) 65%)"></div>
<div aria-hidden="true" class="lg-mote" style="left: 150px; top: 330px; animation-delay: 0s"></div>
<div aria-hidden="true" class="lg-mote" style="left: 228px; top: 340px; animation-delay: 1.7s; width: 4px; height: 4px"></div>
<div aria-hidden="true" class="lg-mote" style="left: 192px; top: 350px; animation-delay: 3.1s"></div>
<div aria-hidden="true" class="lg-mote" style="left: 260px; top: 300px; animation-delay: 4.2s; width: 4px; height: 4px"></div>
<svg role="img" aria-label="The sun is focusing with you. 8 of 12 rays lit: 42 minutes into this hour." width="220" height="220" viewBox="0 0 200 200" style="position: absolute; left: 85px; top: 160px; overflow: visible">
<g class="lg-breathe">
<g class="lg-rays">
<path d="M100 34V18M133 42.8L146 20.3M157.2 67L171 59M166 100H192M157.2 133L171 141M133 157.2L146 179.7M100 166V182M67 157.2L54 179.7" stroke="#FFD15C" stroke-width="9" stroke-linecap="round"></path>
<path class="lg-next" d="M42.8 133L29 141" stroke="#FFD15C" stroke-width="9" stroke-linecap="round"></path>
<path d="M34 100H8M42.8 67L29 59M67 42.8L54 20.3" stroke="rgba(255,209,92,.22)" stroke-width="9" stroke-linecap="round"></path>
</g>
<circle cx="100" cy="100" r="56" fill="#FFC93C"></circle>
<circle cx="72" cy="113" r="7" fill="#F7A1B5"></circle>
<circle cx="128" cy="113" r="7" fill="#F7A1B5"></circle>
<path d="M76 98q8 7 16 0M92 116q8 6 16 0" fill="none" stroke="#16244A" stroke-width="4.5" stroke-linecap="round"></path>
<path class="lg-winkhide" d="M108 98q8 7 16 0" fill="none" stroke="#16244A" stroke-width="4.5" stroke-linecap="round"></path>
<g class="lg-wink"><circle cx="116" cy="96" r="6" fill="#16244A"></circle><circle cx="118" cy="94" r="2" fill="#FFFFFF"></circle></g>
</g>
</svg>
<div style="position: absolute; inset: 0; box-sizing: border-box; padding: 16px 24px 40px; display: flex; flex-direction: column; gap: 16px">
<div style="display: flex; align-items: center; justify-content: space-between; height: 44px">
<a href="Home.dc.html" aria-label="Minimise" style="width: 44px; height: 44px; margin-left: -10px; display: flex; align-items: center; justify-content: center; color: #FFFFFF"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"></path></svg></a>
<span style="font-size: 15px; font-weight: 600">Piano</span>
<div style="width: 34px"></div>
</div>
<div style="flex-grow: 1"></div>
<div style="display: flex; flex-direction: column; align-items: center; gap: 10px">
<span style="font-size: 88px; font-weight: 300; letter-spacing: -0.04em; line-height: 1; font-variant-numeric: tabular-nums">42:18</span>
<span style="font-size: 15px; color: rgba(255,255,255,.75)">Next ray in 2:42 · golden hour in 17:42</span>
</div>
<div style="height: 48px"></div>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
<button type="button" style="height: 56px; border: 0; border-radius: 16px; background: rgba(255,255,255,.12); color: #FFFFFF; font: inherit; font-size: 16px; font-weight: 600">Pause</button>
<button type="button" style="height: 56px; border: 0; border-radius: 16px; background: #FFFFFF; color: #16244A; font: inherit; font-size: 16px; font-weight: 600">Finish</button>
</div>
</div>
</div>
</x-dc>

</body>
</html>
