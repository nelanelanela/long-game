<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Average hours per week</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#16244A}a:hover{color:#000000}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 16px 24px 32px; background: #FAF8F4; color: #16244A; font-family: Inter, -apple-system, system-ui, sans-serif; display: flex; flex-direction: column; gap: 18px">
<div style="display: flex; align-items: center; justify-content: space-between; height: 44px">
<a href="CatchUpAsk.dc.html" aria-label="Back" style="width: 44px; height: 44px; margin-left: -10px; display: flex; align-items: center; justify-content: center; color: #16244A"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"></path></svg></a>
<span style="font-size: 15px; font-weight: 600">Catch up</span>
<div style="width: 34px"></div>
</div>
<div style="display: flex; flex-direction: column; gap: 8px">
<h1 style="margin: 0; font-size: 30px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.1">10 weeks have passed</h1>
<p style="margin: 0; font-size: 16px; line-height: 1.45; color: #5E6782">Since 14 August. On average, how many hours a week did you practise?</p>
</div>
<div style="display: flex; flex-direction: column; align-items: center; gap: 18px; padding: 28px 20px 24px; background: #FFFFFF; border-radius: 24px">
<div style="display: flex; flex-direction: column; align-items: center; gap: 4px">
<span style="font-size: 64px; font-weight: 700; letter-spacing: -0.04em; line-height: 1; font-variant-numeric: tabular-nums">{{avg}}</span>
<span style="font-size: 14px; color: #5E6782">hours per week</span>
</div>
<label for="avg" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Average hours per week</label>
<input id="avg" type="range" min="0" max="40" step="1" value="{{avg}}" onChange="{{setAvg}}" style="width: 100%; margin: 0; accent-color: #16244A">
<div style="align-self: stretch; display: flex; justify-content: space-between; font-size: 12px; color: #5E6782"><span>0</span><span>20</span><span>40</span></div>
</div>
<div style="display: flex; flex-direction: column; padding: 0 18px; background: #FFFFFF; border-radius: 20px">
<div style="display: flex; align-items: center; justify-content: space-between; height: 52px; border-bottom: 1px solid #F0ECE5">
<span style="font-size: 15px">Period</span>
<span style="font-size: 15px; color: #5E6782">15 Aug – 24 Oct · 71 days</span>
</div>
<div style="display: flex; align-items: center; justify-content: space-between; height: 52px; border-bottom: 1px solid #F0ECE5">
<span style="font-size: 15px">Per day in calendar</span>
<span style="font-size: 15px; color: #5E6782">{{perDay}}</span>
</div>
<div style="display: flex; align-items: center; justify-content: space-between; height: 52px">
<span style="font-size: 15px; font-weight: 600">Adding</span>
<span style="font-size: 17px; font-weight: 700">{{totalLabel}}</span>
</div>
</div>
<div style="flex-grow: 1"></div>
<a href="Home.dc.html" style="height: 56px; flex-shrink: 0; border-radius: 16px; background: #16244A; color: #FFFFFF; font-size: 16px; font-weight: 600; text-decoration: none; display: flex; align-items: center; justify-content: center">{{buttonLabel}}</a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const avg = (this.state && this.state.avg != null) ? this.state.avg : 7;
const days = 71;
const total = Math.round(avg * days / 7);
const m = Math.round(avg / 7 * 60);
return { avg, total, totalLabel: total + ' h', buttonLabel: 'Add ' + total + ' hours', perDay: Math.floor(m / 60) + ' h ' + String(m % 60).padStart(2, '0') + ' m', setAvg: (e) => this.setState({ avg: Number(e.target.value) }) };
}
}
</script>
</body>
</html>
