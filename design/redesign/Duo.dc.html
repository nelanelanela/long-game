<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>iPhone Duo, open</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#16244A}a:hover{color:#000000}
</style>
</helmet>
<div style="width: 802px; height: 573px; position: relative; overflow: hidden; background: #FAF7F1; color: #16244A; font-family: Inter, -apple-system, system-ui, sans-serif; display: flex">
<div style="width: 400px; position: relative; overflow: hidden; border-right: 1px solid #ECE7DE">
<div style="position: absolute; inset: 0"><dc-import name="Sky" w="400" h="573" tone="day" horizon="0.78" glowX="0.55" hint-size="400px,573px"></dc-import></div>
<div style="position: absolute; left: 24px; right: 24px; top: 16px; display: flex; align-items: center; justify-content: space-between"><span style="font-size: 28px; font-weight: 700; letter-spacing: -0.02em">Piano</span><span style="display: flex; gap: 2px"><a href="Calendar.dc.html" aria-label="History" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#16244A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="3"></rect><path d="M3 10h18M8 3v4M16 3v4"></path></svg></a><a href="OneCraft.dc.html" aria-label="Add a craft" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#16244A" stroke-width="1.8" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg></a></span></div>
<div role="tablist" aria-label="Home view" style="position: absolute; left: 24px; right: 24px; top: 70px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); padding: 3px; background: #EFE2CF; border-radius: 12px"><span role="tab" aria-selected="false" style="height: 34px; font-size: 13px; font-weight: 500; display: flex; align-items: center; justify-content: center">Today</span><span role="tab" aria-selected="true" style="height: 34px; border-radius: 10px; background: #FFFFFF; font-size: 13px; font-weight: 600; display: flex; align-items: center; justify-content: center; box-shadow: 0 1px 3px rgba(22,36,74,0.1)">This week</span><span role="tab" aria-selected="false" style="height: 34px; font-size: 13px; font-weight: 500; display: flex; align-items: center; justify-content: center">The long game</span></div>
<svg aria-hidden="true" width="400" height="573" viewBox="0 0 400 573" style="position: absolute; left: 0; top: 0"><path d="M44 447V140" stroke="#16244A" stroke-width="1.2" opacity="0.5"></path><path d="M40 140h8M40 293h8M40 447h8" stroke="#16244A" stroke-width="1.2" opacity="0.5"></path><path d="M100 281H190" stroke="#E0A040" stroke-width="1.5" stroke-dasharray="3 4"></path></svg>
<span style="position: absolute; left: 54px; top: 132px; font-size: 11px; font-weight: 600; color: #5E6782">12 h</span>
<span style="position: absolute; left: 30px; top: 269px; padding: 4px 9px; border-radius: 12px; background: #16244A; color: #FFFFFF; font-size: 13px; font-weight: 700">6.5 h</span>
<div style="position: absolute; left: 175px; top: 206px"><dc-import name="Sun" size="150" face="happy" hint-size="150px,150px"></dc-import></div>
<div style="position: absolute; left: 0; top: 402px"><dc-import name="Land" w="400" h="120" tone="day" lane="0.62" hint-size="400px,120px"></dc-import></div>
</div>
<div style="flex: 1; padding: 70px 32px 24px; display: flex; flex-direction: column">
<span style="font-size: 64px; font-weight: 700; letter-spacing: -0.045em; line-height: 1">6.5 h</span>
<span style="margin-top: 6px; font-size: 15px; color: #5E6782">of 12 h this week · 54%</span>
<div style="margin-top: 22px; padding: 12px 0; border-top: 1px solid #ECE7DE; border-bottom: 1px solid #ECE7DE; display: flex; justify-content: space-between; align-items: flex-end">
<sc-for list="{{days}}" as="d" hint-placeholder-count="7"><span style="display: flex; flex-direction: column; align-items: center; gap: 6px"><span style="width: {{d.w}}; height: {{d.h}}; border-radius: 5px; background: {{d.bg}}"></span><span style="font-size: 11px; color: #5E6782">{{d.l}}</span></span></sc-for>
</div>
<div style="margin-top: 14px; display: flex; flex-direction: column; gap: 3px"><span style="font-size: 15px; font-weight: 600">5.5 h to go · 3 days left</span><span style="font-size: 13px; color: #5E6782">Your pace for the year: 12 h a week, until 2 Nov 2027</span></div>
<div style="margin-top: 16px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); padding: 10px 0; border-top: 1px solid #ECE7DE">
<span style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 12px; color: #5E6782">The long game</span><span style="font-size: 16px; font-weight: 700">3,294 h</span></span>
<span style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 12px; color: #5E6782">Pace</span><span style="font-size: 16px; font-weight: 700">9.5 h/wk</span></span>
<span style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 12px; color: #5E6782">Finish line</span><span style="font-size: 16px; font-weight: 700; color: #B4561A">Nov 2035</span></span>
</div>
<div style="flex: 1"></div>
<div style="display: flex; gap: 10px"><a href="LogPast.dc.html" style="flex: 1; height: 50px; border-radius: 14px; background: #EFEBE4; font-size: 15px; font-weight: 600; text-decoration: none; display: flex; align-items: center; justify-content: center">Add past hours</a><a href="Timer.dc.html" style="flex: 1; height: 50px; border-radius: 14px; background: #16244A; color: #FFFFFF; font-size: 15px; font-weight: 600; text-decoration: none; display: flex; align-items: center; justify-content: center; box-shadow: 0 8px 20px rgba(22,36,74,0.22)">Begin</a></div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":802,"height":573}}'>
class Component extends DCLogic {
  renderVals() {
    const d = [['M', 1.2], ['T', 2.0], ['W', -1], ['T', 1.5], ['F', 1.8], ['S', 0], ['S', 0]];
    return { days: d.map(([l, h]) => ({ l: l, w: h > 0 ? '20px' : (h < 0 ? '6px' : '12px'), h: h > 0 ? Math.round(h / 2.5 * 40) + 'px' : (h < 0 ? '6px' : '4px'), bg: h > 0 ? 'linear-gradient(180deg,#FFD45A,#F0922A)' : (h < 0 ? '#C5D0EC' : '#E4DFD6') })) };
  }
}
</script>
</body>
</html>
