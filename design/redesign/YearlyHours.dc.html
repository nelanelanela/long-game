<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Hours a week, each year</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#16244A}a:hover{color:#000000}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 16px 24px 22px; background: linear-gradient(180deg,#FFF1DA 0%,#FAF7F1 38%); color: #16244A; font-family: Inter, -apple-system, system-ui, sans-serif; display: flex; flex-direction: column">
<div style="height: 44px; display: flex; align-items: center; justify-content: space-between; position: relative">
<a href="StartYear.dc.html" aria-label="Back" style="width: 44px; height: 44px; margin-left: -10px; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#16244A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"></path></svg></a>
<div aria-label="Step 3 of 5" style="position: absolute; left: 50%; transform: translateX(-50%); display: flex; gap: 6px"><span style="width: 22px; height: 4px; border-radius: 2px; background: linear-gradient(90deg,#FFC93C,#F0922A)"></span><span style="width: 22px; height: 4px; border-radius: 2px; background: linear-gradient(90deg,#FFC93C,#F0922A)"></span><span style="width: 22px; height: 4px; border-radius: 2px; background: linear-gradient(90deg,#FFC93C,#F0922A)"></span><span style="width: 22px; height: 4px; border-radius: 2px; background: #E4DFD6"></span><span style="width: 22px; height: 4px; border-radius: 2px; background: #E4DFD6"></span></div>
<span style="width: 44px"></span>
</div>
<h1 style="margin: 18px 0 0; font-size: 30px; font-weight: 700; letter-spacing: -0.02em">Hours a week, each year</h1>
<div style="margin-top: 16px; padding: 2px 16px; background: #FFFFFF; border-radius: 22px; box-shadow: 0 10px 30px rgba(22,36,74,0.06)">
<sc-for list="{{rows}}" as="row" hint-placeholder-count="8">
<div style="display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: {{row.border}}">
<span style="flex: 1; font-size: 15px; font-weight: 600">{{row.year}}</span>
<button type="button" aria-label="Less" style="width: 36px; height: 36px; flex-shrink: 0; border: 0; border-radius: 18px; background: radial-gradient(circle at 35% 30%, #FFFFFF, #EFEAE1); box-shadow: 0 3px 8px rgba(22,36,74,0.08); display: flex; align-items: center; justify-content: center; cursor: pointer"><svg aria-hidden="true" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#16244A" stroke-width="2.4" stroke-linecap="round"><path d="M6 12h12"></path></svg></button>
<span style="min-width: 58px; padding: 4px 0; border-radius: 10px; text-align: center; font-size: 17px; font-weight: 600; font-variant-numeric: tabular-nums; background: {{row.bg}}">{{row.hours}}</span>
<button type="button" aria-label="More" style="width: 36px; height: 36px; flex-shrink: 0; border: 0; border-radius: 18px; background: radial-gradient(circle at 35% 30%, #FFFFFF, #EFEAE1); box-shadow: 0 3px 8px rgba(22,36,74,0.08); display: flex; align-items: center; justify-content: center; cursor: pointer"><svg aria-hidden="true" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#16244A" stroke-width="2.4" stroke-linecap="round"><path d="M12 6v12M6 12h12"></path></svg></button>
</div>
</sc-for>
</div>
<button type="button" style="align-self: center; margin-top: 6px; height: 40px; border: 0; background: transparent; font-family: Inter, sans-serif; font-size: 14px; font-weight: 600; color: #16244A; cursor: pointer">Use 10 h for the years after 2023</button>
<div style="display: flex; justify-content: space-between; align-items: baseline; margin-top: 8px"><span style="font-size: 15px; color: #5E6782">Your starting score</span><span style="font-size: 28px; font-weight: 700; letter-spacing: -0.02em">3,208 h</span></div>
<div style="flex: 1"></div>
<a href="WeeklyPace.dc.html" style="height: 56px; flex-shrink: 0; border-radius: 16px; background: #16244A; color: #FFFFFF; font-size: 16px; font-weight: 600; text-decoration: none; display: flex; align-items: center; justify-content: center; box-shadow: 0 8px 20px rgba(22,36,74,0.22)">Continue</a>
<span style="margin-top: 12px; text-align: center; font-size: 11px; font-weight: 600; letter-spacing: 0.16em; text-transform: uppercase; color: #5E6782">by We Have Sun</span>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const data = [[2019, 3], [2020, 5], [2021, 6], [2022, 8], [2023, 10], [2024, 8], [2025, 12], [2026, 12]];
    return {
      rows: data.map(([y, h], i) => ({
        year: String(y), hours: h + ' h',
        bg: y === 2023 ? '#FFF0C8' : 'transparent',
        border: i === data.length - 1 ? '0' : '1px solid #F0ECE5'
      }))
    };
  }
}
</script>
</body>
</html>
