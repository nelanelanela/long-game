<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>What's your game?</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#16244A}a:hover{color:#000000}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 16px 24px 22px; background: #FAF7F1; color: #16244A; font-family: Inter, -apple-system, system-ui, sans-serif; display: flex; flex-direction: column">
<div style="height: 44px; display: flex; align-items: center; justify-content: space-between; position: relative">
<a href="Intro3.dc.html" aria-label="Back" style="width: 44px; height: 44px; margin-left: -10px; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#16244A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"></path></svg></a>
<div aria-label="Step 1 of 5" style="position: absolute; left: 50%; transform: translateX(-50%); display: flex; gap: 6px"><span style="width: 20px; height: 4px; border-radius: 2px; background: linear-gradient(90deg,#FFC93C,#F0922A)"></span><span style="width: 20px; height: 4px; border-radius: 2px; background: #E4DFD6"></span><span style="width: 20px; height: 4px; border-radius: 2px; background: #E4DFD6"></span><span style="width: 20px; height: 4px; border-radius: 2px; background: #E4DFD6"></span><span style="width: 20px; height: 4px; border-radius: 2px; background: #E4DFD6"></span></div>
<span style="width: 44px"></span>
</div>
<h1 style="margin: 18px 0 0; font-size: 30px; font-weight: 700; letter-spacing: -0.02em">What’s your game?</h1>
<label style="margin-top: 14px; height: 48px; flex-shrink: 0; border-radius: 14px; background: #FFFFFF; box-shadow: 0 6px 18px rgba(22,36,74,0.05), inset 0 0 0 {{fieldRing}} #16244A; display: flex; align-items: center; gap: 10px; padding: 0 14px"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5E6782" stroke-width="2" stroke-linecap="round"><path d="M4 20h4L19 9l-4-4L4 16z"></path><path d="M13.5 6.5l4 4"></path></svg><span style="flex: 1; font-size: 16px; color: {{fieldInk}}">{{fieldText}}</span><span aria-label="Clear" style="display: {{clearShow}}; width: 20px; height: 20px; border-radius: 10px; background: #C9C3B8; color: #FFFFFF; font-size: 13px; line-height: 20px; text-align: center">✕</span></label>

<div style="position: relative; flex: 1 1 0; min-height: 0; overflow: hidden; margin: 0 -24px; padding: 0 24px">
<div style="display: flex; flex-wrap: wrap; gap: 6px; align-content: flex-start">
<sc-for list="{{items}}" as="it" hint-placeholder-count="12">
<span style="flex-basis: {{it.basis}}; margin-top: {{it.mt}}; padding: {{it.pad}}; border-radius: 18px; font-size: {{it.fs}}; font-weight: {{it.fw}}; line-height: {{it.lh}}; background: {{it.bg}}; color: {{it.color}}; box-shadow: {{it.shadow}}">{{it.text}}</span>
</sc-for>
</div>
<div aria-hidden="true" style="position: absolute; left: 0; right: 0; bottom: 0; height: 48px; background: linear-gradient(180deg, rgba(250,247,241,0) 0%, #FAF7F1 90%)"></div>
</div>
<a href="StartYear.dc.html" style="margin-top: 14px; height: 56px; flex-shrink: 0; border-radius: 16px; background: #16244A; color: #FFFFFF; font-size: 16px; font-weight: 600; text-decoration: none; display: flex; align-items: center; justify-content: center; box-shadow: 0 8px 20px rgba(22,36,74,0.22)">{{cta}}</a>
<span style="margin-top: 12px; text-align: center; font-size: 11px; font-weight: 600; letter-spacing: 0.16em; text-transform: uppercase; color: #5E6782">by We Have Sun</span>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"query":{"editor":"text","default":"Calligraphy"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  // Behaviour:
  //  - Empty field: placeholder "Type any craft, or pick one below", all groups shown, nothing selected.
  //  - As soon as 2+ characters are typed, the first row is "Your own" with one chip holding the typed text,
  //    already selected (navy), unless the text exactly matches a suggestion (then that suggestion is selected).
  //  - All the other choices stay visible at the same time, under their group labels, never filtered:
  //    the own chip is added on top, nothing is taken away. Tapping any of them selects it instead.
  //  - Under the own chip, the line "Not on the list? It's your game, call it anything."
  //  - Continue (and Return on the keyboard) works as soon as a name of 2–40 characters exists.
  renderVals() {
    const groups = [
      ['Music', ['Piano', 'Guitar', 'Violin', 'Cello', 'Drums', 'Bass', 'Saxophone', 'Flute', 'Trumpet', 'Singing', 'Composing']],
      ['Visual arts & making', ['Painting', 'Drawing', 'Sculpture', 'Woodworking', 'Ceramics', 'Photography', 'Illustration', 'Printmaking', 'Textiles', 'Jewellery']],
      ['Performing arts', ['Acting', 'Dance', 'Ballet', 'Directing']],
      ['Words & mind', ['Writing', 'Poetry', 'Languages', 'Chess', 'Coding']],
      ['Professions', ['Medicine', 'Law', 'Architecture', 'Design', 'Cooking', 'Teaching']]
    ];
    const q = String(this.props.query == null ? 'Calligraphy' : this.props.query).trim();
    const ql = q.toLowerCase();
    const label = (t, mt) => ({ text: t, basis: '100%', mt: mt, pad: '0', fs: '12px', fw: 600, lh: '1.3', bg: 'transparent', color: '#5E6782', shadow: 'none' });
    const chip = (t, sel) => ({ text: t, basis: 'auto', mt: '0', pad: '8px 13px', fs: '14px', fw: sel ? 600 : 500, lh: '1.2', bg: sel ? '#16244A' : '#FFFFFF', color: sel ? '#FFFFFF' : '#16244A', shadow: sel ? '0 4px 12px rgba(22,36,74,0.2)' : 'none' });
    const items = [];
    const all = groups.flatMap(g => g[1]);
    const exact = all.find(n => n.toLowerCase() === ql);
    if (q.length >= 2 && !exact) {
      items.push(label('Your own', '14px'));
      items.push(chip('+  ' + q, true));
      items.push({ text: 'Not on the list? It’s your game, call it anything.', basis: '100%', mt: '2px', pad: '0', fs: '13px', fw: 400, lh: '1.4', bg: 'transparent', color: '#5E6782', shadow: 'none' });
    }
    groups.forEach(([name, list]) => {
      items.push(label(name, '14px'));
      list.forEach(n => items.push(chip(n, exact === n)));
    });
    const name = exact || (q.length >= 2 ? q : '');
    return {
      items: items,
      fieldText: q.length ? q : 'Type any craft, or pick one below',
      fieldInk: q.length ? '#16244A' : '#8A93AB',
      fieldRing: q.length ? '1.5px' : '0',
      clearShow: q.length ? 'block' : 'none',
      cta: name ? 'Play ' + name : 'Continue'
    };
  }
}
</script>
</body>
</html>
