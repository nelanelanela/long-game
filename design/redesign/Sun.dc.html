<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sun</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
@keyframes snBreath{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-4px) scale(1.045)}}
@keyframes snHalo{0%,100%{opacity:0.8}50%{opacity:1}}
@keyframes snTurn{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
@keyframes snPeek{0%,93%{opacity:0}94.5%,98.5%{opacity:1}100%{opacity:0}}
@keyframes snShut{0%,93%{opacity:1}94.5%,98.5%{opacity:0}100%{opacity:1}}
.sn-bob,.sn-rays,.sn-halo{transform-box:view-box;transform-origin:100px 100px}
.sn-peek{opacity:0}
.sn-idle .sn-bob{animation:snBreath 4s ease-in-out infinite}
.sn-idle .sn-halo{animation:snHalo 4s ease-in-out infinite}
.sn-idle .sn-rays{animation:snTurn 120s linear infinite}
.sn-blink .sn-peek{animation:snPeek 9s linear infinite}
.sn-blink.sn-both .sn-shut{animation:snShut 9s linear infinite}
@media (prefers-reduced-motion: reduce){.sn-idle .sn-bob,.sn-idle .sn-halo,.sn-idle .sn-rays,.sn-blink .sn-peek,.sn-blink.sn-both .sn-shut{animation:none}}
</style>
</helmet>
<div class="{{cls}}" style="width: {{px}}; height: {{px}}; position: relative">
<svg role="img" aria-label="{{label}}" width="100%" height="100%" viewBox="0 0 200 200" style="display: block; overflow: visible">
<defs>
<radialGradient id="lgHalo" cx="50%" cy="50%" r="50%">
<stop offset="0%" stop-color="#FFC93C" stop-opacity="0.32"></stop>
<stop offset="62%" stop-color="#FFC93C" stop-opacity="0"></stop>
</radialGradient>
</defs>
<g class="sn-bob">
<circle class="sn-halo" cx="100" cy="100" r="{{haloR}}" fill="url(#lgHalo)"></circle>
<g class="sn-rays">
<path d="{{unlitD}}" fill="none" stroke="#FFB627" stroke-width="9" stroke-linecap="round" opacity="0.22"></path>
<path d="{{litD}}" fill="none" stroke="#FFB627" stroke-width="9" stroke-linecap="round"></path>
</g>
<circle cx="100" cy="100" r="56" fill="#FFC93C"></circle>
<circle cx="72" cy="113" r="{{cheekR}}" fill="{{cheek}}"></circle>
<circle cx="128" cy="113" r="{{cheekR}}" fill="{{cheek}}"></circle>
<path class="sn-shut" d="{{eyesD}}" fill="none" stroke="#16244A" stroke-width="4.5" stroke-linecap="round"></path>
<circle cx="84" cy="95" r="{{leftEye}}" fill="#16244A"></circle>
<circle cx="86" cy="93" r="{{leftHi}}" fill="#FFFFFF"></circle>
<circle cx="116" cy="95" r="{{rightEye}}" fill="#16244A"></circle>
<circle cx="118" cy="93" r="{{rightHi}}" fill="#FFFFFF"></circle>
<path d="{{mouthD}}" fill="{{mouthFill}}" stroke="#16244A" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"></path>
<g class="sn-peek"><circle cx="84" cy="95" r="{{peekL}}" fill="#16244A"></circle><circle cx="86" cy="93" r="{{peekLh}}" fill="#FFFFFF"></circle><circle cx="116" cy="95" r="6.5" fill="#16244A"></circle><circle cx="118" cy="93" r="2" fill="#FFFFFF"></circle></g>
<path d="M92 121q8-7 16 0q-8 6-16 0z" fill="#F48FA8" opacity="{{tongueOp}}"></path>
<text x="150" y="54" font-family="Inter, sans-serif" font-weight="600" font-size="22" fill="#8FA2E0" opacity="{{zOp}}">z</text>
</g>
</svg>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"size":{"editor":"int","default":200,"min":16,"max":600},"face":{"editor":"enum","default":"happy","options":["happy","focus","wink","sleepy","open","celebrate","gasp","laugh"]},"lit":{"editor":"int","default":12,"min":0,"max":12},"halo":{"editor":"boolean","default":true},"idle":{"editor":"boolean","default":true},"$preview":{"width":200,"height":200}}'>
class Component extends DCLogic {
  renderVals() {
    const size = parseFloat(this.props.size) || 200;
    const face = this.props.face || 'happy';
    const raw = this.props.lit;
    const litN = raw === undefined || raw === null || raw === '' ? 12 : Math.max(0, Math.min(12, parseInt(raw, 10) || 0));
    const halo = !(this.props.halo === false || this.props.halo === 'false');
    let lit = '', unlit = '';
    for (let i = 0; i < 12; i++) {
      const a = (i * 30 - 90) * Math.PI / 180;
      const r2 = i % 2 === 0 ? 92 : 82;
      const seg = 'M' + (100 + 66 * Math.cos(a)).toFixed(1) + ' ' + (100 + 66 * Math.sin(a)).toFixed(1) + 'L' + (100 + r2 * Math.cos(a)).toFixed(1) + ' ' + (100 + r2 * Math.sin(a)).toFixed(1);
      if (i < litN) lit += seg; else unlit += seg;
    }
    const closed = 'M76 98q8-9 16 0M108 98q8-9 16 0';
    const smile = 'M88 114q12 11 24 0';
    const faces = {
      happy:     { e: closed, l: 0, r: 0, m: smile, f: 'none', z: 0 },
      focus:     { e: 'M77 98q7 5 14 0M109 98q7 5 14 0', l: 0, r: 0, m: 'M93 115q7 5 14 0', f: 'none', z: 0 },
      wink:      { e: 'M76 98q8-9 16 0', l: 0, r: 6.5, m: smile, f: 'none', z: 0 },
      sleepy:    { e: 'M77 101q7 4 14 0M109 101q7 4 14 0', l: 0, r: 0, m: 'M95 118q5 2 10 0', f: 'none', z: 1 },
      open:      { e: '', l: 6.5, r: 6.5, m: smile, f: 'none', z: 0 },
      celebrate: { e: '', l: 7, r: 7, m: 'M85 111q15 20 30 0z', f: '#16244A', z: 0 },
      gasp:      { e: '', l: 7.5, r: 7.5, m: 'M100 111a6 7 0 1 0 0.1 0z', f: '#16244A', z: 0 },
      laugh:     { e: 'M76 100q8-11 16 0M108 100q8-11 16 0', l: 0, r: 0, m: 'M83 108q17 28 34 0z', f: '#16244A', z: 0, t: 1, ck: 1 }
    };
    const g = faces[face] || faces.happy;
    const idle = !(this.props.idle === false || this.props.idle === 'false');
    const blink = idle && (face === 'happy' || face === 'focus');
    const cls = (idle ? 'sn-idle' : '') + (blink ? ' sn-blink' : '') + (blink && face === 'happy' ? ' sn-both' : '');
    return {
      px: size + 'px', cls: cls, peekL: face === 'happy' ? 6.5 : 0, peekLh: face === 'happy' ? 2 : 0, label: 'The sun, ' + face,
      haloR: halo ? 130 : 0,
      litD: lit, unlitD: unlit, eyesD: g.e,
      leftEye: g.l, rightEye: g.r, leftHi: g.l ? 2 : 0, rightHi: g.r ? 2 : 0,
      mouthD: g.m, mouthFill: g.f, zOp: g.z,
      tongueOp: g.t ? 1 : 0, cheekR: g.ck ? 11 : 7, cheek: g.ck ? '#F48FA8' : '#F7A1B5'
    };
  }
}
</script>
</body>
</html>
