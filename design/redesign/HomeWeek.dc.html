<div style="display: flex; flex-direction: column; align-items: center; gap: 4px; margin-top: 4px">

<span style="font-size: 15px; color: #5E6782">of 12 h this week · 54%</span>

<div aria-label="This week, planned and played, by day" style="margin-top: 16px; padding: 12px 6px 8px; border-top: 1px solid #ECE7DE; border-bottom: 1px solid #ECE7DE; display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 8px">
<sc-for list="{{days}}" as="d" hint-placeholder-count="7">

<div style="position: relative; width: 22px; height: 64px; display: flex; align-items: flex-end; justify-content: center">
<span style="position: absolute; left: 0; right: 0; bottom: 0; height: 44px; border-radius: 6px; border: 1.2px dashed #CFC6B6"></span>
<span style="position: relative; width: {{d.w}}; height: {{d.h}}; border-radius: {{d.r}}; background: {{d.bg}}; box-shadow: {{d.sh}}"></span>
</div>
<span style="font-size: 12px; font-weight: {{d.fw}}; color: {{d.c}}">{{d.l}}</span>
</div>
</sc-for>
</div>

<a href="LogPast.dc.html" style="height: 44px; margin-top: 2px; flex-shrink: 0; font-size: 15px; font-weight: 600; text-decoration: none; display: flex; align-items: center; justify-content: center">Add past hours</a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const data = [['M', 1.2, 'p'], ['T', 2.0, 'p'], ['W', 0, 'rest'], ['T', 1.5, 'p'], ['F', 1.8, 'today'], ['S', 0, 'future'], ['S', 0, 'future']];
    return {
      days: data.map(([l, h, k]) => {
        const played = k === 'p' || k === 'today';
        const hh = played ? Math.max(6, Math.round(h / 2.5 * 64)) : (k === 'rest' ? 6 : 4);
        return {
          l: l,
          w: played ? '22px' : (k === 'rest' ? '6px' : '14px'),
          h: hh + 'px',
          r: played ? '6px' : '3px',
          bg: played ? 'linear-gradient(180deg,#FFD45A,#F0922A)' : (k === 'rest' ? '#C5D0EC' : '#E4DFD6'),
          sh: played ? '0 4px 10px rgba(240,146,42,0.35)' : 'none',
          fw: k === 'today' ? 700 : 500,
          c: k === 'today' ? '#16244A' : '#5E6782'
        };
      })
    };
  }
}
</script>
</body>
