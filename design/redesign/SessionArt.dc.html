<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Session sunrise</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<div style="width: {{px}}; height: {{px}}; position: relative; overflow: hidden; border-radius: {{radius}}">
<svg role="img" aria-label="{{label}}" width="100%" height="100%" viewBox="0 0 240 240" style="display: block">
<defs>
<linearGradient id="{{uid}}sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="{{sky1}}"></stop><stop offset="100%" stop-color="{{sky2}}"></stop></linearGradient>
<radialGradient id="{{uid}}sun" cx="40%" cy="35%" r="70%"><stop offset="0%" stop-color="{{sun1}}"></stop><stop offset="100%" stop-color="{{sun2}}"></stop></radialGradient>
<radialGradient id="{{uid}}glow" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="{{sun1}}" stop-opacity="{{glowOp}}"></stop><stop offset="100%" stop-color="{{sun1}}" stop-opacity="0"></stop></radialGradient>
<linearGradient id="{{uid}}dune" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="{{dune1}}"></stop><stop offset="100%" stop-color="{{dune2}}"></stop></linearGradient>
<filter id="{{uid}}blur" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="1.6"></feGaussianBlur></filter>
</defs>
<rect width="240" height="240" fill="url(#{{uid}}sky)"></rect>
<path d="{{stars}}" fill="#FFF4D6" opacity="{{starOp}}"></path>
<circle cx="{{sx}}" cy="{{sy}}" r="{{glowR}}" fill="url(#{{uid}}glow)"></circle>
<circle cx="{{sx}}" cy="{{sy}}" r="{{sr}}" fill="url(#{{uid}}sun)"></circle>
<path d="{{backDune}}" fill="{{back}}"></path>
<path d="{{frontDune}}" fill="url(#{{uid}}dune)"></path>
<path d="{{lines}}" fill="none" stroke="{{lineC}}" stroke-width="2.2" opacity="{{glowLineOp}}" filter="url(#{{uid}}blur)"></path>
<path d="{{lines}}" fill="none" stroke="{{lineC}}" stroke-width="0.8" opacity="{{lineOp}}" stroke-linecap="round"></path>
</svg>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"size":{"editor":"int","default":240,"min":24,"max":600},"start":{"editor":"range","default":7.67,"min":0,"max":23.99,"step":0.25,"unit":"h"},"minutes":{"editor":"int","default":40,"min":1,"max":240},"progress":{"editor":"range","default":0.4,"min":0,"max":1,"step":0.05},"seed":{"editor":"int","default":7},"corner":{"editor":"int","default":0},"$preview":{"width":240,"height":240}}'>
class Component extends DCLogic {
  renderVals() {
    const num = (v, d) => { const n = parseFloat(v); return isNaN(n) ? d : n; };
    const size = num(this.props.size, 240);
    const start = num(this.props.start, 7.67);
    const minutes = Math.max(1, num(this.props.minutes, 40));
    const progress = Math.max(0, Math.min(1, num(this.props.progress, 0.4)));
    const seed = Math.floor(num(this.props.seed, 7));
    let a = (seed * 2654435761 + Math.round(start * 60) * 40503 + minutes * 97) >>> 0;
    const rnd = () => { a = (a + 0x6D2B79F5) >>> 0; let t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
    const pals = {
      night:     { sky1: '#0E0C1C', sky2: '#3A2116', sun1: '#FFD58A', sun2: '#E8862E', back: '#2A1B22', dune1: '#3A2418', dune2: '#1A1210', line: '#FFC873', lineOp: 0.85, glowLine: 0.55, stars: 0.8, glow: 0.5 },
      morning:   { sky1: '#FCF3D6', sky2: '#F7E2B0', sun1: '#FFE27A', sun2: '#F5A93A', back: '#F0D49A', dune1: '#EBC27A', dune2: '#E2AE5E', line: '#FFFFFF', lineOp: 0.9, glowLine: 0, stars: 0, glow: 0.45 },
      midday:    { sky1: '#F9DD7C', sky2: '#F3B845', sun1: '#FFFBE6', sun2: '#FFD86A', back: '#EDB04A', dune1: '#E9A23B', dune2: '#DA8A2C', line: '#FFF6DA', lineOp: 0.85, glowLine: 0, stars: 0, glow: 0.6 },
      afternoon: { sky1: '#F6C860', sky2: '#EC8A3A', sun1: '#FFE9A8', sun2: '#FFB04A', back: '#E58A3A', dune1: '#DC6E2E', dune2: '#B9501F', line: '#FFE3B0', lineOp: 0.8, glowLine: 0.25, stars: 0, glow: 0.5 },
      evening:   { sky1: '#D2602E', sky2: '#4E2030', sun1: '#FFC27A', sun2: '#E8562A', back: '#6A2A2E', dune1: '#40192A', dune2: '#1E0F18', line: '#FF9A5A', lineOp: 0.85, glowLine: 0.5, stars: 0.35, glow: 0.55 }
    };
    const key = start < 5.5 || start >= 21.5 ? 'night' : start < 10 ? 'morning' : start < 14.5 ? 'midday' : start < 18 ? 'afternoon' : 'evening';
    const P = pals[key];
    const horizon = 150 + rnd() * 14;
    const sx = 60 + rnd() * 120;
    const sr = 18 + Math.min(minutes, 150) / 150 * 34;
    const sy = horizon + sr * 0.15 - progress * 90;
    const wave = (base, amp, ph, freq) => {
      let d = 'M-10 ' + (base + amp * Math.sin(ph)).toFixed(1);
      for (let x = 0; x <= 250; x += 10) {
        const y = base + amp * Math.sin(x / 240 * Math.PI * freq + ph) + amp * 0.35 * Math.sin(x / 240 * Math.PI * freq * 2.3 + ph * 1.7);
        d += 'L' + x + ' ' + y.toFixed(1);
      }
      return d;
    };
    const ph1 = rnd() * 6.28, ph2 = rnd() * 6.28;
    const f1 = 1.2 + rnd() * 1.2, f2 = 1 + rnd() * 1.4;
    const backTop = wave(horizon, 7 + rnd() * 6, ph1, f1);
    const frontBase = horizon + 22 + rnd() * 10;
    const frontAmp = 9 + rnd() * 9;
    const frontTop = wave(frontBase, frontAmp, ph2, f2);
    const n = Math.max(2, Math.min(18, Math.round(minutes / 5)));
    let lines = '';
    for (let i = 0; i < n; i++) {
      const t = (i + 1) / (n + 1);
      lines += wave(frontBase + 4 + t * (232 - frontBase), frontAmp * (1 - t * 0.5), ph2 + t * 0.25, f2);
    }
    let stars = '';
    if (P.stars) {
      for (let i = 0; i < 14; i++) {
        const x = rnd() * 240, y = rnd() * (horizon - 30), r = rnd() < 0.2 ? 1.1 : 0.6;
        stars += 'M' + (x - r).toFixed(1) + ' ' + y.toFixed(1) + 'a' + r + ' ' + r + ' 0 1 0 ' + (2 * r) + ' 0a' + r + ' ' + r + ' 0 1 0 ' + (-2 * r) + ' 0';
      }
    }
    const hh = Math.floor(start), mm = Math.round((start - hh) * 60);
    const corner = num(this.props.corner, 0);
    return {
      px: size + 'px', radius: corner + 'px',
      uid: 'sa' + seed + '_' + Math.round(start * 100) + '_' + minutes,
      label: 'Session sunrise for ' + String(hh).padStart(2, '0') + ':' + String(mm).padStart(2, '0') + ', ' + minutes + ' minutes',
      sky1: P.sky1, sky2: P.sky2, sun1: P.sun1, sun2: P.sun2, back: P.back, dune1: P.dune1, dune2: P.dune2,
      glowOp: P.glow, glowR: (sr * 2.6).toFixed(1),
      sx: sx.toFixed(1), sy: sy.toFixed(1), sr: sr.toFixed(1),
      backDune: backTop + 'L250 240L-10 240Z',
      frontDune: frontTop + 'L250 240L-10 240Z',
      lines: lines, lineC: P.line, lineOp: P.lineOp, glowLineOp: P.glowLine,
      stars: stars, starOp: P.stars
    };
  }
}
</script>
</body>
</html>
