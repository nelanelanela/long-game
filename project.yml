name: LongGame
options:
  bundleIdPrefix: com.wehavesun
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"
    MARKETING_VERSION: "1.0"
    DEVELOPMENT_TEAM: DGB322BJZ7
    CODE_SIGN_STYLE: Automatic
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_EMIT_LOC_STRINGS: YES
targets:
  LongGame:
    type: application
    platform: iOS
    sources:
      - LongGame
      - Shared
      - path: LongGame.storekit
        buildPhase: none
    dependencies:
      - target: LongGameWidgets
    # The widgets open Home on a tab with longgame://home/week or longgame://home/longGame.
    info:
      path: LongGame/Info.plist
      properties:
        CFBundleURLTypes:
          - CFBundleURLName: com.wehavesun.LongGame
            CFBundleURLSchemes: [longgame]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wehavesun.LongGame
        INFOPLIST_KEY_NSSupportsLiveActivities: YES
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: Long Game
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UIApplicationSupportsMultipleScenes: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        ENABLE_PREVIEWS: YES
        CODE_SIGN_ENTITLEMENTS: LongGame/LongGame.entitlements
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) CLOUD_SYNC"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
  LongGameWidgets:
    type: app-extension
    platform: iOS
    sources:
      - LongGameWidgets
      - Shared
      - LongGame/DesignSystem/SunView.swift
      - LongGame/DesignSystem/Colors.swift
      - LongGame/DesignSystem/Typography.swift
      - LongGame/DesignSystem/Water.swift
      # The numbers are worked out with the app's own Logic code (it is plain Swift, no database).
      - LongGame/Logic
    info:
      path: LongGameWidgets/Info.plist
      properties:
        CFBundleDisplayName: Long Game
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    # The shared App Group the app writes the widgets' data to. Xcode registers it with your team on a device build.
    entitlements:
      path: LongGameWidgets/LongGameWidgets.entitlements
      properties:
        com.apple.security.application-groups: [group.com.wehavesun.LongGame]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wehavesun.LongGame.Widgets
        SKIP_INSTALL: YES
        CODE_SIGN_ENTITLEMENTS: LongGameWidgets/LongGameWidgets.entitlements
  LongGameTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - LongGameTests
    dependencies:
      - target: LongGame
      - sdk: StoreKitTest.framework
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.wehavesun.LongGameTests
schemes:
  LongGame:
    run:
      storeKitConfiguration: LongGame.storekit
    build:
      targets:
        LongGame: all
        LongGameTests: [test]
    test:
      targets:
        - LongGameTests
