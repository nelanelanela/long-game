name: LongGame
options:
  bundleIdPrefix: app.longgame
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  LongGame:
    type: application
    platform: iOS
    sources:
      - LongGame
      - Shared
    dependencies:
      - target: LongGameWidgets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.longgame.LongGame
        INFOPLIST_KEY_NSSupportsLiveActivities: YES
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: Long Game
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        ENABLE_PREVIEWS: YES
  LongGameWidgets:
    type: app-extension
    platform: iOS
    sources:
      - LongGameWidgets
      - Shared
      - LongGame/DesignSystem/SunView.swift
      - LongGame/DesignSystem/Colors.swift
      - LongGame/Logic/TimerLogic.swift
      - LongGame/Logic/Format.swift
    info:
      path: LongGameWidgets/Info.plist
      properties:
        CFBundleDisplayName: Long Game
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.longgame.LongGame.Widgets
        SKIP_INSTALL: YES
  LongGameTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - LongGameTests
    dependencies:
      - target: LongGame
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: app.longgame.LongGameTests
schemes:
  LongGame:
    build:
      targets:
        LongGame: all
        LongGameTests: [test]
    test:
      targets:
        - LongGameTests
